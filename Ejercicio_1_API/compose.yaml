services:

  mysql:
    image: mysql:8

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laboratorio
      MYSQL_USER: laboratorio
      MYSQL_PASSWORD: laboratorio

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulaboratorio", "-plaboratorio"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .

    ports:
      - "8000:8000"

    depends_on:
      mysql:
        condition: service_healthy


volumes:
  mysql_data: